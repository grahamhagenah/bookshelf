# Temporary: removed before this branch is merged
name: Check covers in production
on:
  push:
    branches: [claude/eager-allen-361gc2]
    paths: [.github/workflows/check-demo-covers.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for path in b/id/8793546-L.jpg b/id/8793546-M.jpg b/id/14818095-M.jpg b/id/99999999-M.jpg b/isbn/9780441172719-M.jpg; do
            echo "===== GET $path"
            curl -s -D - -o body.bin --max-time 40 "https://bookstacks.app/covers/$path" | tr -d '\r'
            echo "body bytes: $(wc -c < body.bin)"; head -c 200 body.bin | od -c | head -3
          done
          echo "===== HEAD"
          curl -s -I --max-time 40 "https://bookstacks.app/covers/b/id/8793546-L.jpg" | tr -d '\r'
